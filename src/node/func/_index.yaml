version: "1.0"
namespace: userspace.dataflow.node.func

entries:
  - name: retry_integration_test
    kind: function.lua
    meta: {type: test, suite: dataflow}
    source: file://retry_integration_test.lua
    modules: [uuid, time, json]
    imports:
      test: wippy.test:test
      client: userspace.dataflow:client
      commit: userspace.dataflow.persist:commit
      consts: userspace.dataflow:consts
      data_reader: userspace.dataflow.persist:data_reader
      node_reader: userspace.dataflow.persist:node_reader
      activation_repo: userspace.dataflow.persist:activation_repo
      func: userspace.dataflow.node.func:node
      inspection: userspace.dataflow:inspection
      workflow_state: userspace.dataflow.runner:workflow_state
      scheduler: userspace.dataflow.runner:scheduler
    method: run_tests
    security:
      actor: {id: dataflow.test}
      policies: [app:test_policy]

  - name: retry_fixture
    kind: function.lua
    meta: {scope: dev}
    source: file://retry_fixture.lua
    modules: [ctx, time]
    method: run

  - name: retry_test
    kind: function.lua
    meta: {type: test, suite: dataflow}
    source: file://retry_test.lua
    modules: [time]
    imports:
      test: wippy.test:test
      func: userspace.dataflow.node.func:node
    method: run_tests

  # userspace.dataflow.node.func:control_test_func
  - name: control_test_func
    kind: function.lua
    meta:
      name: Control Command Test Function
      comment: Test function that returns control commands to create sub-workflows
      tags:
        - dataflow
        - node
        - function
        - control
        - test
        - workflow
      description: |
        Test function that demonstrates control command functionality by creating
        various types of sub-workflows (simple, chain, parallel) based on input.
        Used to test func node's ability to handle _control commands properly.
    source: file://control_test_func.lua
    modules:
      - uuid
      - ctx
    method: run

  # userspace.dataflow.node.func:signal_child_func
  - name: signal_child_func
    kind: function.lua
    meta:
      name: Signal Child Test Function
      comment: Test function that creates a signal child node via a control directive (for func-node recovery tests).
    source: file://signal_child_func.lua
    modules:
      - uuid
    method: run

  # userspace.dataflow.node.func:func_child_output_test
  - name: func_child_output_test
    kind: function.lua
    meta:
      name: Func Node Child Output Tests
      type: test
      comment: Verifies func node child output collection and recovery waits.
      group: Workflow / Function Node
    source: file://func_child_output_test.lua
    modules:
      - uuid
    imports:
      consts: userspace.dataflow:consts
      func: userspace.dataflow.node.func:node
      test: wippy.test:test
    method: run_tests

  # userspace.dataflow.node.func:func_test
  - name: func_test
    kind: function.lua
    meta:
      name: Function Node Tests
      type: test
      comment: Unit tests for the function executor node
      group: Workflow / Function Node
      tags:
        - dataflow
        - node
        - function
        - executor
        - tests
      description: |
        Comprehensive unit tests for the function executor node including
        configuration validation, input handling, function execution,
        cancellation support, and error handling scenarios.
    source: file://func_test.lua
    modules:
      - uuid
      - json
    imports:
      client: userspace.dataflow:client
      consts: userspace.dataflow:consts
      data_reader: userspace.dataflow.persist:data_reader
      func: userspace.dataflow.node.func:node
      node_reader: userspace.dataflow.persist:node_reader
      test: wippy.test:test
    method: run_tests
  # userspace.dataflow.node.func:node
  - name: node
    kind: process.lua
    meta:
      name: Function Executor Node
      comment: Generic node for executing functions within dataflow workflows
      tags:
        - dataflow
        - node
        - function
        - executor
        - cancellable
      description: "A generic dataflow node that executes functions using the funcs module.\nSupports input data processing, function context configuration, and \ngraceful cancellation handling. Can execute any registered function\nwith proper error handling and result routing.\n"
      default_host: app:processes
    source: file://node.lua
    modules:
      - funcs
      - json
      - time
    imports:
      retry: userspace.dataflow:retry
      child_output: userspace.dataflow:child_output
      consts: userspace.dataflow:consts
      node: userspace.dataflow:node
    method: run
  # userspace.dataflow.node.func:node_test
  - name: node_test
    kind: function.lua
    meta:
      name: Function Node Tests
      type: test
      comment: Unit tests for the function executor node
      group: Workflow / Function Node
      tags:
        - dataflow
        - node
        - function
        - executor
        - tests
      description: |
        Comprehensive unit tests for the function executor node including
        configuration validation, input handling, function execution,
        cancellation support, and error handling scenarios.
    source: file://node_test.lua
    modules:
      - uuid
      - json
    imports:
      client: userspace.dataflow:client
      consts: userspace.dataflow:consts
      data_reader: userspace.dataflow.persist:data_reader
      func: userspace.dataflow.node.func:node
      test: wippy.test:test
    method: run_tests
  # userspace.dataflow.node.func:test_func
  - name: test_func
    kind: function.lua
    meta:
      name: Test Node Function
      comment: Simple test node for dataflow testing and integration tests
      tags:
        - dataflow
        - node
        - test
        - integration
      description: |
        A simple test node that processes input data with configurable delay and failure modes.
    source: file://test_func.lua
    modules:
      - time
    method: run

  - name: native_error_func
    kind: function.lua
    meta:
      name: Native Error Test Function
      scope: dev
    source: file://native_error_func.lua
    method: run

  # userspace.dataflow.node.func:call_loop_test
  - name: call_loop_test
    kind: function.lua
    meta:
      name: Function Call Loop Tests
      type: test
      comment: Verifies async startup, event handling, cancellation, and result errors.
      group: Workflow / Function Node
    source: file://call_loop_test.lua
    modules: [uuid, time, json]
    imports:
      test: wippy.test:test
