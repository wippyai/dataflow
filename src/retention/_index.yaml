version: "1.0"
namespace: userspace.dataflow.retention
entries:
  - name: sweeper
    kind: library.lua
    meta:
      comment: Indexed diagnostic draining and bounded terminal family retention.
    source: file://sweeper.lua
    modules: [time]

  - name: sweeper_test
    kind: function.lua
    meta:
      type: test
      suite: Retention
    source: file://sweeper_test.lua
    modules: [sql, uuid, time, registry]
    imports:
      test: wippy.test:test
      sweeper: userspace.dataflow.retention:sweeper
      ops: userspace.dataflow.persist:ops
      client: userspace.dataflow:client
      commit: userspace.dataflow.persist:commit
      commit_repo: userspace.dataflow.persist:commit_repo
      activation_repo: userspace.dataflow.persist:activation_repo
      dataflow_repo: userspace.dataflow.persist:dataflow_repo
    method: run_tests

  - name: process
    kind: process.lua
    source: file://service.lua
    modules: [env, sql, time, logger]
    imports:
      sweeper: userspace.dataflow.retention:sweeper
    method: run

  - name: service
    kind: process.service
    meta:
      comment: Native opt-in diagnostic and family retention, configured through Dataflow dependency parameters.
    process: userspace.dataflow.retention:process
    host: app:processes
    lifecycle:
      auto_start: false
      depends_on: []
      security:
        actor:
          id: system.dataflow.retention
        groups: [userspace.dataflow.security:retention]
