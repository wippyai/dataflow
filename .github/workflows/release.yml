name: Release Please

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Release Please
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required for Release Please to create tags and GitHub releases.
      pull-requests: write # Required for Release Please to create and update release pull requests.
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Actions may not open pull requests with GITHUB_TOKEN in this repository;
      # the release app opens the release PR, which also lets CI run on it.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish release
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - id: wippy
        uses: ./.github/actions/setup-wippy

      - name: Release notes
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py --line CHANGELOG.md "$RELEASE_VERSION" > release-notes.txt
          test -s release-notes.txt

      - name: Pack and publish release
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          WIPPY: ${{ steps.wippy.outputs.path }}
          WIPPY_TOKEN: ${{ secrets.WIPPY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${WIPPY_TOKEN:-}"
          manifest_version="$(awk '/^version:/ { print $2; exit }' wippy.yaml)"
          test "$manifest_version" = "$RELEASE_VERSION"
          "$WIPPY" publish --version "$RELEASE_VERSION" --dry-run
          "$WIPPY" publish --version "$RELEASE_VERSION" --release-notes "$(cat release-notes.txt)"
